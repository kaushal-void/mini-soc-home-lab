# Adapted from official Wazuh v4.14.7 single-node deployment.
services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
    - 127.0.0.1:1514:1514
    - 127.0.0.1:1515:1515
    environment:
    - INDEXER_URL=https://wazuh.indexer:9200
    - INDEXER_USERNAME=admin
    - INDEXER_PASSWORD=${INDEXER_PASSWORD:?set private env file}
    - FILEBEAT_SSL_VERIFICATION_MODE=full
    - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
    - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
    - SSL_KEY=/etc/ssl/filebeat.key
    - API_USERNAME=wazuh-wui
    - API_PASSWORD=${API_PASSWORD:?set private env file}
    volumes:
    - wazuh_api_configuration:/var/ossec/api/configuration
    - wazuh_etc:/var/ossec/etc
    - wazuh_logs:/var/ossec/logs
    - wazuh_queue:/var/ossec/queue
    - wazuh_var_multigroups:/var/ossec/var/multigroups
    - wazuh_integrations:/var/ossec/integrations
    - wazuh_active_response:/var/ossec/active-response/bin
    - wazuh_agentless:/var/ossec/agentless
    - wazuh_wodles:/var/ossec/wodles
    - filebeat_etc:/etc/filebeat
    - filebeat_var:/var/lib/filebeat
    - ../private/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
    - ../private/certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
    - ../private/certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
    - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    - ./config/local_internal_options.conf:/var/ossec/etc/local_internal_options.conf:ro
    - ./config/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 2.0
    mem_limit: 2g
  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: unless-stopped
    ports:
    - 127.0.0.1:9200:9200
    environment:
    - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
    - wazuh-indexer-data:/var/lib/wazuh-indexer
    - ../private/certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
    - ../private/certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
    - ../private/certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
    - ../private/certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
    - ../private/certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
    - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
    - ../private/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 2.0
    mem_limit: 3g
  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: unless-stopped
    ports:
    - 127.0.0.1:8443:5601
    environment:
    - INDEXER_USERNAME=admin
    - INDEXER_PASSWORD=${INDEXER_PASSWORD:?set private env file}
    - WAZUH_API_URL=https://wazuh.manager
    - DASHBOARD_USERNAME=kibanaserver
    - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?set private env file}
    - API_USERNAME=wazuh-wui
    - API_PASSWORD=${API_PASSWORD:?set private env file}
    volumes:
    - ../private/certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
    - ../private/certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
    - ../private/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
    - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
    - ../private/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
    - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
    - wazuh.indexer
    links:
    - wazuh.indexer:wazuh.indexer
    - wazuh.manager:wazuh.manager
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    cpus: 2.0
    mem_limit: 1g
volumes:
  wazuh_api_configuration: null
  wazuh_etc: null
  wazuh_logs: null
  wazuh_queue: null
  wazuh_var_multigroups: null
  wazuh_integrations: null
  wazuh_active_response: null
  wazuh_agentless: null
  wazuh_wodles: null
  filebeat_etc: null
  filebeat_var: null
  wazuh-indexer-data: null
  wazuh-dashboard-config: null
  wazuh-dashboard-custom: null
name: soc-lab

